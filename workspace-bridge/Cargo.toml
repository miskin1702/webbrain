[package]
name = "webbrain-workspace"
version = "0.1.0"
edition = "2021"
description = "WebBrain Local Workspace Bridge Daemon"
license = "GPL-3.0-or-later"

[lib]
name = "webbrain_workspace"
path = "src/lib.rs"

[[bin]]
name = "webbrain-workspace"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
notify = "7.0"
ignore = "0.4"
regex = "1.11"
dunce = "1.0"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
blake3 = "1.5"
clap = { version = "4.5", features = ["derive"] }
uuid = { version = "1.11", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.15"
